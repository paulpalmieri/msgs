<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#FAFAFA"/>
  
  <!-- Accent bar at top -->
  <rect width="1200" height="8" fill="#D95218"/>
  
  <!-- Decorative grid pattern (subtle) -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#E5E5E5" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="0" y="8" width="1200" height="622" fill="url(#grid)" opacity="0.5"/>
  
  <!-- Main content container -->
  <g transform="translate(600, 280)">
    <!-- MSGS Logo -->
    <text 
      x="0" 
      y="0" 
      text-anchor="middle" 
      font-family="Impact, 'Bebas Neue', sans-serif" 
      font-size="180" 
      font-weight="400"
      letter-spacing="0.04em"
      fill="#0A0A0A"
    >MSGS</text>
    
    <!-- Tagline -->
    <text 
      x="0" 
      y="80" 
      text-anchor="middle" 
      font-family="'JetBrains Mono', 'SF Mono', monospace" 
      font-size="24" 
      font-weight="400"
      fill="#525252"
    >Rediscover your Messenger &amp; Instagram chats</text>
    
    <!-- Sub-tagline -->
    <text 
      x="0" 
      y="130" 
      text-anchor="middle" 
      font-family="'JetBrains Mono', 'SF Mono', monospace" 
      font-size="18" 
      font-weight="400"
      fill="#A3A3A3"
    >Beautiful analytics • 100% private • Runs in your browser</text>
  </g>
  
  <!-- Decorative accent elements -->
  <rect x="80" y="500" width="120" height="4" fill="#D95218"/>
  <rect x="1000" y="500" width="120" height="4" fill="#D95218"/>
  
  <!-- Corner accent -->
  <rect x="80" y="80" width="4" height="40" fill="#D95218"/>
  <rect x="80" y="80" width="40" height="4" fill="#D95218"/>
  
  <rect x="1116" y="80" width="4" height="40" fill="#D95218"/>
  <rect x="1080" y="80" width="40" height="4" fill="#D95218"/>
</svg>

